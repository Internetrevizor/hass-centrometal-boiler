name: HACS

on:
  push:
  pull_request:
  # Called by release.yml, which publishes a release only after these pass.
  workflow_call:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
