name: Validate

on:
  push:
  pull_request:
  # Called by release.yml, which publishes a release only after these pass.
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install validation tools
        # homeassistant is required: ten of the tests import the integration
        # package, which imports Home Assistant. Without it pytest cannot
        # collect them and the job passes while the orchestration, entity
        # and registry tests never run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant aiohttp pytest pytest-asyncio ruff "websockets>=13.1" "certifi>=2024.7.4" voluptuous
      - name: Compile Python files
        run: python -m compileall custom_components tests tests_ha
      - name: Ruff critical checks
        run: ruff check .
      - name: Run tests
        run: pytest

  home-assistant:
    # The integration running inside a real Home Assistant, connected to a
    # local fake of the Centrometal cloud (tests_ha/fake_centrometal.py).
    # pytest-homeassistant-custom-component pins its own Home Assistant
    # release, so it gets a job of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests_ha/requirements.txt
      - name: Run the integration against the fake cloud
        run: python -m pytest -c tests_ha/pytest.ini tests_ha -v
