name: Hassfest

on:
  push:
  pull_request:
  # Called by release.yml, which publishes a release only after these pass.
  workflow_call:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
