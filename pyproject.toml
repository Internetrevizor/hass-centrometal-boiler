[tool.ruff]
target-version = "py313"
line-length = 120
src = ["custom_components", "tests"]

[tool.ruff.lint]
# E9/F63/F7/F82 alone only catch syntax-level breakage. F (unused and
# undefined names), B (bugbear: mutable defaults, except-without-raise,
# useless expressions) and UP (constructs that are deprecated aliases today
# and removals tomorrow, e.g. asyncio.TimeoutError) are what actually keep a
# long-lived integration compiling on the next Python.
select = ["E4", "E7", "E9", "W", "F", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately evaluate properties for their side effect of raising,
# assert on broad exceptions, and import after sys.path setup.
"tests/*" = ["B017", "B018", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
